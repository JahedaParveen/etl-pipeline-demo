name: etl-pipeline-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl}
      POSTGRES_DB: ${POSTGRES_DB:-weather}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    healthcheck:
      # -h forces a TCP check, so it only passes once init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  prefect-server:
    image: prefecthq/prefect:3.4.25-python3.11
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-etl}:${POSTGRES_PASSWORD:-etl}@postgres:5432/prefect
      PREFECT_UI_API_URL: http://localhost:${PREFECT_HOST_PORT:-4200}/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "${PREFECT_HOST_PORT:-4200}:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  pipeline:
    build: .
    command: python -m pipeline.serve
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-etl}:${POSTGRES_PASSWORD:-etl}@postgres:5432/${POSTGRES_DB:-weather}
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_URL: http://localhost:${PREFECT_HOST_PORT:-4200}
      PREFECT_LOGGING_EXTRA_LOGGERS: pipeline
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
